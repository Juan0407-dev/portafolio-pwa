<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión · Mi Cuaderno</title>
  <meta name="theme-color" content="#0B3D2E">
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #0B3D2E; color: #fff; text-align: center; }
    main { max-width: 420px; }
    .icon { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
            background: #E0A526; color: #0B3D2E; display: grid; place-items: center; font-size: 2rem; font-weight: 700; }
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    p { color: #C8D8CE; line-height: 1.55; margin-bottom: 24px; }
    button { padding: 11px 22px; border: 0; border-radius: 6px; background: #E0A526; color: #0B3D2E;
             font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">!</div>
    <h1>Estás sin conexión</h1>
    <p>No pudimos cargar esta página y todavía no se guardó en tu dispositivo. Revisa tu conexión a internet e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
